[project]
name = "agent-desk"
version = "0.1.0"
description = "Agent Desk — LLM agent API and chat workspace"
readme = "README.md"
authors = [
    { name = "Yash Jadhav", email = "yashjadhav1411@rocketmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-openai>=1.4.1",
    "python-dotenv",
    "langchain",
    "rich>=15.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-checkpoint-postgres>=3.1.1",
    "uvicorn>=0.52.1",
    "fastapi>=0.141.1",
    "requests>=2.34.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "swagger-theme-toggle>=0.1.1",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
